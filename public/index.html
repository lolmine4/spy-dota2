<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Шпион по Dota 2: все видят одного героя или предмет, кроме шпиона.">
  <title>Шпион · Dota 2</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" data-act="home">Шпион <span>Dota 2</span></a>
    <div id="bar-room"></div>
  </header>
  <div id="offline" class="offline" hidden>Нет связи с сервером, переподключаюсь…</div>

  <main id="home" class="home" hidden></main>

  <main id="game" class="layout" hidden>
    <div class="main">
      <div id="panel"></div>
      <section id="board" class="board" hidden>
        <div class="board-head">
          <div>
            <h3 id="board-title">Все варианты</h3>
            <p id="board-hint" class="muted small"></p>
          </div>
          <div class="board-tools">
            <input id="search" type="search" placeholder="Поиск по названию" autocomplete="off">
            <button class="ghost small" data-act="resetMarks">Сбросить</button>
          </div>
        </div>
        <div id="board-grid"></div>
      </section>
    </div>
    <aside id="players" class="players"></aside>
  </main>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
